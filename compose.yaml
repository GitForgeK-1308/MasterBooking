services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: masterbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d masterbooking",
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/masterbooking

    command:
      [
        "uv",
        "run",
        "--frozen",
        "--no-dev",
        "alembic",
        "upgrade",
        "head",
      ]

    depends_on:
      db:
        condition: service_healthy


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/masterbooking

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started


  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/masterbooking
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379

    command:
      [
        "uv",
        "run",
        "--frozen",
        "--no-dev",
        "celery",
        "-A",
        "src.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--pool=solo",
      ]

    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy


  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/masterbooking
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379

    command:
      [
        "uv",
        "run",
        "--frozen",
        "--no-dev",
        "celery",
        "-A",
        "src.tasks.celery_app:celery_app",
        "beat",
        "--loglevel=info",
      ]

    depends_on:
      redis:
        condition: service_started


volumes:
  postgres_data:

  redis_data: